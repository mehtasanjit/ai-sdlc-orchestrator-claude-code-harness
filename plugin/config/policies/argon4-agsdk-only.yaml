# Argon only floor — every file a run types routes to Gemini 4 Argon via the
# Antigravity SDK agent adapter (Vertex ADC). Same shape as flash-agsdk-only-v38,
# with two differences: the model, and the leaf pins region: global (v38 follows
# GOOGLE_CLOUD_LOCATION).
#
# Runs under either auth mode: the thinking steps go to Argon through the server in
# both, and the session runs on the driver: model. No Claude model belongs in this file: the ladder's last
# attempt goes to a policy's first Claude leaf (executor/tools.ts fallbackLeaf), so
# one here would type files. With none, the last attempt stays on Argon.
#
# Thinking steps follow the rules below (plugin 0.10.0). Requirements, the architect
# and both reviewers run on Argon as an agent through execute_judgment, in a scratch
# copy of the project; only each step's own outputs come back. A step that still fails
# its checks after one fix round is handed back to the session's Claude helper, and its
# telemetry events carry judgment_fallback. Discovery, the orchestrator's own turns and
# the gates run on the driver: model, which the driver check pins
# (CLAUDE_CODE_SUBAGENT_MODEL) under both auth modes; estimated and vendor alike. Version 1 of this policy ran
# under plugins before 0.10.0, where the session's own model planned and reviewed
# whatever the rules said; version 2 keeps those runs apart in telemetry.
version: 2
name: argon4-agsdk-only

# The session's model: the orchestrator, discovery, the gates, and any thinking step
# handed back from the agent. Outside models: so no rule or typist ladder reaches it.
driver:
  model_name: claude-opus-5-5

models:
  - id: argon
    adapter: antigravity-worker
    model_name: gemini-4-argon
    display_name: gemini-4-argon (Antigravity agent)
    # Gemini 4 Argon introductory card, in force 13 Oct 2026 – 30 Nov 2026. From 1 Dec 2026 the
    # price list bills 4.00 / 0.20 / 20.00; on that day this card must change to match, and
    # test/prices.test.mjs fails until it does. A December run is not halted: it bills the list's
    # card, and this card draws a price warning until it is changed. Output includes thinking
    # tokens. Argon has implicit caching only, so input_cached is that rate.
    pricing: { input: 2.00, input_cached: 0.10, output: 10.00 }
    pricing_source: https://ai.google.dev/gemini-api/docs/pricing
    pricing_last_verified: 2026-11-02
    # Pinned, not left to GOOGLE_CLOUD_LOCATION: a regional endpoint bills +10%
    # (applyVertexSurcharge).
    region: global
    # Vertex-only: the Antigravity SDK is ADC-only and has no API-key door, so
    # no `auth:` block.
    worker_timeout_sec: 540
    # No `reasoning:`: every typist runs at low effort (executor/tools.ts
    # TYPIST_EFFORT), so a tier here would read as a setting and change nothing.
    # No max_output_tokens_absolute — agent sessions manage their own per-turn
    # limits.

rules:
  # Every phase → argon. Explicit rules per phase (not just a default) so
  # telemetry rollups show the routing decision was intentional per-phase.
  - when: { phase: requirements_analysis }
    use: argon
    reason: "Floor tier: judgment routed to Argon agent"
  - when: { phase: architecture_design }
    use: argon
    reason: "Floor tier: judgment routed to Argon agent"
  - when: { phase: plan_task_packets }
    use: argon
    reason: "Floor tier: judgment routed to Argon agent"
  - when: { phase: senior_code_review }
    use: argon
    reason: "Floor tier: judgment routed to Argon agent"
  - when: { phase: security_review }
    use: argon
    reason: "Floor tier: judgment routed to Argon agent"

  # Brownfield-mode phases.
  - when: { phase: discovery }
    use: argon
    reason: "Floor tier: brownfield discovery routed to Argon agent"
  - when: { phase: change_plan }
    use: argon
    reason: "Floor tier: brownfield change plan routed to Argon agent"

  # Mechanical tier.
  - when: { phase: codegen }
    use: argon
    reason: "Mechanical tier — all codegen task types"
  - when: { phase: tests }
    use: argon
    reason: "Mechanical tier"
  - when: { phase: docs }
    use: argon
    reason: "Mechanical tier"
  - when: { phase: debug }
    use: argon
    reason: "Mechanical tier — no escalation; this policy is the floor"

  - default: argon
    reason: "Single-model floor policy"
