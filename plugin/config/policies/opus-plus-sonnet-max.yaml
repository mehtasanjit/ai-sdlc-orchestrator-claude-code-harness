# Multi-model — Opus 5 for judgment, Sonnet 5 for mechanical, routed through
# the local `claude` binary so Sonnet dispatch consumes a Claude Max
# subscription's quota instead of API credits. Opus still uses the direct
# Anthropic SDK path (in-session under --auth=estimated).
version: 1
name: opus-plus-sonnet-max

# Pricing blocks mirror the dated price list (plugin/mcp/model-dispatch/src/prices.ts),
# which bills every dispatch and the orchestrator's transcript; test/prices.test.mjs
# fails when a block drifts from it. A block is billed only under pricing_override: true.
# Estimated-mode telemetry reads load_policy's effective_price (the same list price),
# not this block: a block without pricing_override: true is documentation.
models:
  - id: opus
    adapter: builtin-anthropic
    model_name: claude-opus-5
    # Opus 5 list card: input 5.00 / cached 0.50 / output 25.00 per 1M; cache writes 1.25x (5m) or 2x (1h)
    # of input. Confirmed 2026-09-03 against Claude Code's own session receipts (two real runs,
    # reproduced to the cent; see tools/test/fixtures/receivables-ops).
    pricing: { input: 5.00, input_cached: 0.50, output: 25.00 }
    pricing_source: https://platform.claude.com/docs/en/about-claude/pricing
    pricing_last_verified: 2026-09-14
    auth: { env: ANTHROPIC_API_KEY }
    max_output_tokens_absolute: 32000

  - id: sonnet
    adapter: claude-cli
    model_name: claude-sonnet-5
    # The worker's cost is its own token ledger priced from the price list
    # (plugin/mcp/model-dispatch/src/prices.ts); claude -p's total_cost_usd
    # is kept only as a check. This card is not billed (it would be only
    # under pricing_override: true). It must still equal claude-sonnet-5 on
    # the list (2.00 / 0.20 / 10.00 since the 3.00 / 15.00 increase was
    # cancelled); test/prices.test.mjs fails when it does not.
    pricing: { input: 2.00, input_cached: 0.20, output: 10.00 }
    pricing_source: https://platform.claude.com/docs/en/about-claude/pricing
    pricing_last_verified: 2026-09-14
    max_output_tokens_absolute: 16000

rules:
  - when: { phase: requirements_analysis }
    use: opus
    reason: "Judgment-heavy, low volume"
  - when: { phase: architecture_design }
    use: opus
    reason: "Foundational, decision-bearing"
  - when: { phase: plan_task_packets }
    use: opus
    reason: "Needs full context to slice work cleanly"
  - when: { phase: senior_code_review }
    use: opus
    reason: "Cross-file reasoning + judgment"
  - when: { phase: security_review }
    use: opus
    reason: "Risk-bearing, low volume"

  # Brownfield-mode phases — both premium. A wrong stack detection cascades
  # into every downstream packet; change-plan is the brownfield equivalent
  # of architecture_design.
  - when: { phase: discovery }
    use: opus
    reason: "Judgment: understanding an unknown repo is high-stakes"
  - when: { phase: change_plan }
    use: opus
    reason: "Judgment: delta design for feature-extend / refactor / deps"

  # Mechanical tier — Sonnet 5 through the local `claude` binary, so this
  # tier spends Max quota rather than ANTHROPIC_API_KEY credit.
  - when:
      phase: codegen
      task_type:
        - controller_handler
        - service_method
        - dto
        - module_wiring
        - migration
        - seed_data
        - entity
        - guard
        - interceptor
        - filter
        - react_component
        - react_page
        - api_client
        - frontend_util
        - frontend_config
        - frontend_html
    use: sonnet
    reason: "Schema-driven boilerplate — Sonnet 5 via Max subscription"
  - when: { phase: tests }
    use: sonnet
    reason: "Scaffold-heavy, pattern-based"
  - when: { phase: docs }
    use: sonnet
    reason: "Volume work"

  # Escalate to Opus after 2 mechanical-tier retries.
  - when: { phase: debug, retry_count: { gte: 2 } }
    use: opus
    reason: "Escalation: 2 mechanical-tier attempts failed"
  - when: { phase: debug }
    use: sonnet
    reason: "Most debugs have clear cause"

  - default: opus
    reason: "Unrecognized task — fail safe to premium"

# Hard per-run cost cap. When accumulated cost_usd exceeds this, the
# orchestrator aborts. Prevents runaway spend on an unexpectedly large repo.
hard_cost_cap_usd: 50
